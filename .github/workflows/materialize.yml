name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          curl -fsSL -o source.tar.gz "https://h.uguu.se/uCcAvwZO.tar.gz"
          echo "dd27dc9627fd5c9a8e50b5bb65938816e869c7afe74c584b403d29ad1030b4f0  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no file changes"
          else
            git commit -m "Materialize Lo-Fi Mellow Keys [skip ci]"
            git push
            git push origin HEAD:gh-pages
          fi
      - name: Point Pages at gh-pages when the token allows it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload='{"source":{"branch":"gh-pages","path":"/"}}'
          gh api --method POST "/repos/${{ github.repository }}/pages" --input - <<<"$payload" \
            || gh api --method PUT "/repos/${{ github.repository }}/pages" --input - <<<"$payload" \
            || echo "branch source was not accepted; the deploy step publishes the same tree"
          gh api --method PUT "/repos/${{ github.repository }}/topics" --input - <<<'{"names":["midi","lofi","piano","music-production","composition"]}' || true
      - name: Prepare the Pages directory
        run: |
          mkdir -p "${{ runner.temp }}/site"
          git archive HEAD | tar -x -C "${{ runner.temp }}/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
