name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack generator
        run: |
          curl -fsSL -o source.tar.gz "https://h.uguu.se/uCcAvwZO.tar.gz"
          echo "dd27dc9627fd5c9a8e50b5bb65938816e869c7afe74c584b403d29ad1030b4f0  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Commit delivered files
        run: |
          set +e
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no file changes"
            commit_code=0
          else
            git commit -m "Materialize Lo-Fi Mellow Keys [skip ci]" > /tmp/git-commit.txt 2>&1
            commit_code=$?
          fi
          git push origin HEAD:main > /tmp/git-push-main.txt 2>&1
          main_code=$?
          git push origin HEAD:gh-pages > /tmp/git-push-pages.txt 2>&1
          pages_code=$?
          {
            echo "commit_exit=$commit_code main_exit=$main_code pages_exit=$pages_code"
            echo "COMMIT"
            cat /tmp/git-commit.txt 2>/dev/null
            echo "MAIN"
            cat /tmp/git-push-main.txt
            echo "PAGES"
            cat /tmp/git-push-pages.txt
          } > /tmp/git-report.txt
          if [ "$commit_code" -ne 0 ] || [ "$main_code" -ne 0 ] || [ "$pages_code" -ne 0 ]; then
            echo "::error::$(tr '\n' ' ' < /tmp/git-report.txt | cut -c1-900)"
            exit 1
          fi
